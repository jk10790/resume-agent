version: 1
title_guardrails:
  positive:
  - software engineer
  - backend engineer
  - platform engineer
  - staff engineer
  - principal engineer
  - lead software engineer
  negative:
  - intern
  - recruiter
  - designer
  - sales
  - customer success
  - frontend
  seniority_boost:
  - senior
  - staff
  - lead
  - principal
body_guardrails:
  exclude:
  - security clearance|\bTS/SCI\b|\bpolygraph\b|\bTop Secret\b|\bSecret clearance\b
  - must be (a |an )?(US|U\.S\.) citizen|US citizenship (is )?required|U\.S\. citizenship (is )?required
  - \bmust be able to obtain (a )?(security )?clearance\b
  - \bITAR\b|\bEAR99\b|\bexport[- ]control(?:led|s)?\b|\bexport administration regulations\b
  - must be a[n]?(?:\s*\(?[ivx]+\)?)?\s*(?:U\.?S\.?|United States)\s*(?:citizen|person|national)
  - not (be )?(able|willing) to sponsor|unable to sponsor|will not sponsor|no visa sponsorship|without (visa )?sponsorship|do(es)? not (offer|provide) (visa )?sponsorship
  discipline_exclude:
  - \b(is )?looking for an? (frontend|front-end|mobile|ios|android|design) engineer\b
  - \bwe are (seeking|hiring) an? (frontend|front-end|mobile|ios|android) engineer\b
  - \b(frontend|front-end) engineer to (build|own|lead)\b
  - \bbuild the design system\b
